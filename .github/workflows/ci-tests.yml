name: "CI - Tests"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      - name: Build host crate
        run: cargo build --manifest-path host/Cargo.toml

      - name: Run host tests
        run: cargo test --manifest-path host/Cargo.toml

  spore:
    name: spore
    runs-on: ubuntu-latest
    env:
      SPORE_REPOSITORY: spore-lang/spore
      SPORE_REF: d96212aa5a4cfe24759c21d8690642adfd357018
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.SPORE_REPOSITORY }}
          ref: ${{ env.SPORE_REF }}
          path: _spore

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _spore

      - name: Install spore CLI
        run: cargo install --locked --path _spore --bin spore --force

      - name: Format Spore files
        run: spore format --check

      - name: Check Spore files
        run: spore check

      - name: Build Spore files
        run: spore build

      - name: Run standalone hello example
        run: spore run examples/hello.sp

      - name: Run project-mode hello-app example
        run: |
          (
            cd examples/hello-app
            echo "✓ Running project-mode example (default entry)"
            spore run
          )

      - name: Run Spore spec tests
        run: |
          if [ ! -d tests ]; then
            echo "No Spore spec tests yet; skipping spore test."
            exit 0
          fi
          spore test
